services:
  bot:
    build: .
    container_name: telro-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./cookies.txt:/app/cookies.txt:ro
    # Uncomment both lines below when using the local Bot API service.
    # environment:
    #   TELEGRAM_API_SERVER: http://telegram-bot-api:8081

  # Optional: self-hosted Telegram Bot API server → 2 GB uploads instead of 50 MB.
  # Start with:  docker compose --profile local-api up -d
  # Requires TELEGRAM_API_ID and TELEGRAM_API_HASH from https://my.telegram.org
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telro-bot-api
    restart: unless-stopped
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: 1
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api

volumes:
  bot-api-data:
